<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>చందమామ · The Bus Journey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="చందమామ">
<style>
  :root {
    --tel: "Kohinoor Telugu", "Telugu MN", "Noto Sans Telugu", "Gautami", sans-serif;
    --eng: Georgia, "Times New Roman", serif;
    --pw: 300px;   /* one page width  */
    --ph: 472px;   /* one page height */
    --prog: 0;     /* journey progress 0..1 */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b1026; }
  body { font-family: var(--eng); -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none; }
  button, .zone, .th, a { touch-action: manipulation; }

  /* ============ SKY & LANDSCAPE ============ */
  #world { position:fixed; inset:0; overflow:hidden; }
  .sky { position:absolute; inset:0; }
  .sky.dusk {
    background: linear-gradient(to bottom,
      #2b2a5e 0%, #5b3d78 34%, #a75a6d 58%, #e08850 76%, #f4b167 88%, #f9cf8a 100%);
  }
  .sky.night {
    background: linear-gradient(to bottom,
      #05070f 0%, #0a1030 40%, #1a2352 68%, #35386e 85%, #4d4470 100%);
    opacity: var(--prog);
    transition: opacity 1.2s ease;
  }
  #stars { position:absolute; inset:0; opacity: calc(0.25 + var(--prog) * 0.75); transition: opacity 1.2s ease; }
  .star { position:absolute; background:#fff; border-radius:50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.9} 50%{opacity:.25} }

  #moon {
    position:absolute; right:9%; width:min(11vmin,92px); aspect-ratio:1;
    top: calc(30% - var(--prog) * 18%);
    transition: top 1.4s ease;
    filter: drop-shadow(0 0 24px rgba(255,244,200,.55)) drop-shadow(0 0 70px rgba(255,244,200,.25));
  }

  .scroller { position:absolute; left:0; right:0; background-repeat:repeat-x; }
  #hills   { bottom:14%; height:24%; background-size:auto 100%; animation: roll 95s linear infinite; opacity:.85; }
  #trees   { bottom:11%; height:34%; background-size:auto 100%; animation: roll 34s linear infinite; }
  #poles   { bottom:9%;  height:52%; background-size:auto 100%; animation: roll 15s linear infinite; }
  #ground  { bottom:0; height:12%;
    background: linear-gradient(to bottom, #14101f, #060409);
  }
  #road { bottom:6.5%; height:3%;
    background: repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,230,170,.35) 90px 150px);
    background-size: 300px 3px; background-position: 0 55%; background-repeat: repeat-x;
    animation: roll 1.6s linear infinite;
    opacity:.5;
  }
  @keyframes roll { from { background-position-x: 0; } to { background-position-x: -1200px; } }
  .paused .scroller, .paused #road { animation-play-state: paused; }

  /* an oncoming bus passes on the highway now and then */
  #oncoming { position:absolute; bottom:7%; left:0; width:46px; height:14px; opacity:0;
    pointer-events:none; }
  #oncoming.pass { animation: oncomingPass 3s linear forwards; }
  @keyframes oncomingPass {
    0%   { opacity:0; transform: translateX(104vw) scale(.4); }
    12%  { opacity:1; }
    86%  { opacity:1; }
    100% { opacity:0; transform: translateX(-18vw) scale(1.3); }
  }
  #oncoming .hl { position:absolute; top:0; width:13px; height:13px; border-radius:50%;
    background:#fff6d8;
    box-shadow: 0 0 14px 6px rgba(255,240,190,.75), 0 0 46px 20px rgba(255,230,160,.3); }
  #oncoming .hl:first-child { left:0; }
  #oncoming .hl:last-child { right:0; }
  .paused #oncoming { display:none; }

  /* ---- eras: the world outside the window matches the edition's decade ---- */
  /* vintage: pre-1960 — near-monochrome, slower, rattlier */
  body.era-vintage #world { filter: sepia(.55) saturate(.5) contrast(1.06); }
  body.era-vintage #hills { animation-duration: 130s; }
  body.era-vintage #trees { animation-duration: 46s; }
  body.era-vintage #poles { animation-duration: 21s; }
  body.era-vintage #road  { animation-duration: 2.3s; opacity:.35; }
  body.era-vintage #milestone .cap { background:#e8e2d2; border-color:#b8b2a2; }
  body.era-vintage #milestone .stone { background:#f6f2e6; }
  /* classic: 1960s–70s — faded film color */
  body.era-classic #world { filter: sepia(.32) saturate(.7) contrast(1.03); }
  body.era-classic #hills { animation-duration: 110s; }
  body.era-classic #trees { animation-duration: 40s; }
  body.era-classic #poles { animation-duration: 18s; }
  body.era-classic #road  { animation-duration: 1.9s; }
  /* retro: 1980s–90s — warm slightly-washed color */
  body.era-retro #world { filter: sepia(.14) saturate(.88); }
  /* modern (2000s+): as-is */
  #eraYear { position:fixed; z-index:40; font-family:var(--eng);
    top: calc(196px + env(safe-area-inset-top, 0px)); left:26px; width:128px; text-align:center;
    color:rgba(255,240,215,.65); font-size:13px; letter-spacing:3px; font-style:italic; }
  @media (max-width: 640px) {
    #eraYear { width:86px; left:10px; top:calc(150px + env(safe-area-inset-top, 0px)); font-size:11px; }
  }

  #frame { position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 0 10px #17131f, inset 0 0 0 13px #2c2438, inset 0 0 120px rgba(0,0,0,.65);
  }
  #frame::before { content:""; position:absolute; inset:10px; border-radius:18px;
    box-shadow: inset 0 0 0 3px rgba(90,80,110,.5), inset 0 30px 80px rgba(255,255,255,.045);
  }
  #glare { position:absolute; inset:0; pointer-events:none; opacity:.5;
    background: linear-gradient(112deg, transparent 42%, rgba(255,255,255,.05) 46%, rgba(255,255,255,.10) 48%, transparent 55%, transparent 70%, rgba(255,255,255,.05) 74%, transparent 79%);
  }

  /* ============ MILESTONE HUD ============ */
  #milestone {
    position:fixed; top:calc(26px + env(safe-area-inset-top, 0px)); left:26px; z-index:40;
    width:128px; text-align:center; color:#1c1a14;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.5));
    transition: transform .3s ease;
    font-family: var(--tel);
  }
  #milestone .stone {
    background:#f3ead2; border-radius:60px 60px 8px 8px; padding:14px 8px 10px;
    border:2px solid #d9cba4;
  }
  #milestone .cap { height:26px; background:#e9b31a; border-radius:60px 60px 0 0; margin:-16px -10px 8px; border:2px solid #c1920e; }
  #milestone .place { font-size:14px; font-weight:700; line-height:1.3; }
  #milestone .km { font-size:22px; font-weight:800; margin-top:2px; }
  #milestone .km small { font-size:12px; font-weight:600; }
  #milestone.bump { transform: scale(1.08) rotate(-1.5deg); }
  #milestone.home .cap { background:#3fae5a; border-color:#2c8443; }

  /* ============ STAGE / BOOK ============ */
  #stage {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:20; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }
  #bookBob { animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(0.06deg); }
    30%     { transform: translateY(-1.5px) rotate(-0.05deg); }
    62%     { transform: translateY(0.8px) rotate(0.04deg); }
    78%     { transform: translateY(-0.6px) rotate(0deg); }
  }
  #bookShift { transition: transform .55s cubic-bezier(.4,.1,.2,1); }
  #book {
    position:relative; width: calc(var(--pw) * 2); height: var(--ph);
    perspective: 2800px;
  }
  #book::after {
    content:""; position:absolute; left:4%; right:4%; bottom:-26px; height:40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);
    z-index:-1;
  }
  .sheet {
    position:absolute; left:50%; top:0; width:50%; height:100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 850ms cubic-bezier(.36,.08,.22,1);
  }
  .sheet.no-anim { transition: none !important; }
  .sheet.turned { transform: rotateY(-180deg); }
  .sheet.dragging { transition: none !important; }
  /* turn shading: pages darken as they stand up (driven by --ts, 0..1) */
  .face::after { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(to right, rgba(30,20,8,.55), rgba(30,20,8,.08) 65%);
    opacity: var(--ts, 0); transition: opacity .35s ease; }
  .face.back::after { background: linear-gradient(to left, rgba(30,20,8,.55), rgba(30,20,8,.08) 65%); }
  .sheet.dragging .face::after { transition: none; }
  /* shadow the standing page casts on the half it is falling toward */
  #castShadow { position:absolute; top:0; bottom:0; width:50%; pointer-events:none;
    opacity:0; z-index:300; transition: opacity .35s ease; }
  #castShadow.left  { left:0;
    background: linear-gradient(to left, rgba(0,0,0,.42), transparent 75%); }
  #castShadow.right { right:0;
    background: linear-gradient(to right, rgba(0,0,0,.42), transparent 75%); }
  .face {
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:#f6efdd; overflow:hidden;
    border-radius: 0 6px 6px 0;
    box-shadow: inset 0 0 30px rgba(120,90,40,.12);
  }
  .face.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; }
  .face img { width:100%; height:100%; object-fit:cover; display:block; }
  .face .shade { position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(to right, rgba(60,40,10,.18), transparent 14%);
  }
  .face.back .shade { background: linear-gradient(to left, rgba(60,40,10,.18), transparent 14%); }
  .face .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#b9a77f; font-family:var(--tel); font-size:14px; }

  .zone { position:absolute; top:0; bottom:0; width:22%; z-index:30; cursor:pointer; }
  #zonePrev { left:-6%; } #zoneNext { right:-6%; }
  .zone:hover .hint { opacity:.9; }
  .zone .hint { position:absolute; top:50%; transform:translateY(-50%); opacity:0; transition:opacity .25s;
    width:38px; height:38px; border-radius:50%; background:rgba(20,16,30,.55); color:#f4e6c2;
    display:flex; align-items:center; justify-content:center; font-size:18px; backdrop-filter: blur(2px); }
  #zonePrev .hint { left:8px; } #zoneNext .hint { right:8px; }

  /* ============ CONTROL BAR ============ */
  #bar {
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    height: calc(56px + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display:flex; align-items:center; justify-content:center; gap:14px;
    background: linear-gradient(to bottom, #241d31, #171221);
    box-shadow: 0 -6px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    color:#e8dcc0;
  }
  #bar button, #bar a.btn {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); color:#e8dcc0;
    border-radius:9px; padding:7px 13px; font-size:14px; cursor:pointer; font-family:var(--tel);
    transition: background .2s; text-decoration:none; display:inline-block;
  }
  #bar button:hover, #bar a.btn:hover { background:rgba(255,255,255,.14); }
  #pageInfo { font-family:var(--tel); font-size:14px; min-width:90px; text-align:center; letter-spacing:.5px; }
  #progressTrack { position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.08); }
  #progressFill { height:100%; width:0%; background:linear-gradient(90deg,#e9b31a,#f4d574); transition:width .5s ease;
    box-shadow: 0 0 8px rgba(233,179,26,.7); }

  /* ============ THUMBNAILS ============ */
  #thumbs {
    position:fixed; inset:0; z-index:80; background:rgba(8,6,16,.93); backdrop-filter: blur(6px);
    display:none; flex-direction:column; padding:20px;
  }
  #thumbs.open { display:flex; }
  #thumbs header { display:flex; justify-content:space-between; align-items:center; color:#f0e4c4;
    font-family:var(--tel); font-size:18px; padding:0 6px 14px; }
  #thumbs header button { background:none; border:none; color:#f0e4c4; font-size:26px; cursor:pointer; }
  #thumbGrid { flex:1; overflow-y:auto; display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap:12px; padding:4px; }
  #thumbGrid .th { cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid transparent; position:relative;
    aspect-ratio: 1191/1872; background:#241f33; transition: transform .15s; }
  #thumbGrid .th:hover { transform: scale(1.04); border-color:#e9b31a; }
  #thumbGrid .th.current { border-color:#e9b31a; box-shadow:0 0 12px rgba(233,179,26,.5); }
  #thumbGrid .th img { width:100%; height:100%; object-fit:cover; display:block; }
  #thumbGrid .th span { position:absolute; bottom:4px; right:6px; background:rgba(0,0,0,.65); color:#ffe9ad;
    font-size:11px; padding:1px 6px; border-radius:8px; font-family:var(--tel); }

  /* ============ ZOOM ============ */
  #zoomer { position:fixed; inset:0; z-index:95; background:rgba(6,5,12,.97); display:none;
    overflow:hidden; touch-action:none; perspective: 2200px; }
  #zoomer.open { display:block; }
  .zpage { position:absolute; left:0; top:0; transform-origin:0 0; background:#f6efdd;
    user-select:none; -webkit-user-drag:none; box-shadow:0 10px 40px rgba(0,0,0,.6);
    backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .zpage.zflip { transition: transform .52s cubic-bezier(.35,.1,.22,1), opacity .52s ease; }
  #zoomBar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; align-items:center; z-index:2;
    background:rgba(20,16,30,.88); border:1px solid rgba(255,233,173,.25);
    border-radius:26px; padding:7px 12px; }
  #zoomBar button { background:none; border:none; color:#ffe9ad; font-size:20px; cursor:pointer; padding:2px 10px; }
  #zoomInfo { color:#e8dcc0; font-family:var(--tel); font-size:13px; min-width:64px; text-align:center; }
  #zoomHint { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:2;
    color:rgba(255,233,173,.75); font-family:var(--tel); font-size:12.5px;
    background:rgba(20,16,30,.7); padding:6px 16px; border-radius:20px; pointer-events:none;
    transition: opacity 1s ease; }
  #zoomHint.faded { opacity:0; }

  /* snappier, lighter flip on phones */
  @media (max-width: 640px) {
    .sheet { transition-duration: 640ms; }
    .face { box-shadow:none; }
  }

  /* toast */
  #toast { position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-80px); z-index:90;
    background:rgba(20,16,30,.9); color:#ffe9ad; font-family:var(--tel); font-size:15px;
    padding:11px 22px; border-radius:30px; border:1px solid rgba(255,233,173,.25);
    transition: transform .5s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #toast.show { transform:translateX(-50%) translateY(0); }

  /* narrow mode: shade the sliver of the neighbouring page at the screen edges */
  body.narrow #stage::before, body.narrow #stage::after {
    content:""; position:absolute; top:0; bottom:0;
    width: calc((100vw - var(--pw)) / 2 + 2px);
    z-index:26; pointer-events:none;
  }
  body.narrow #stage::before { left:0;
    background: linear-gradient(to right, rgba(9,7,20,.88) 30%, rgba(9,7,20,0)); }
  body.narrow #stage::after  { right:0;
    background: linear-gradient(to left, rgba(9,7,20,.88) 30%, rgba(9,7,20,0)); }

  @media (max-width: 640px) {
    #milestone { width:86px; top:calc(10px + env(safe-area-inset-top, 0px)); left:10px; }
    #milestone .place { font-size:10.5px; } #milestone .km { font-size:16px; }
    #bar { gap:7px; }
    #bar .txt { display:none; }              /* icon-only pills on phones */
    #bar button, #bar a.btn { padding:7px 12px; font-size:16px; line-height:1; }
    #bar #btnFull { display:none; }          /* iPhones don't support it anyway */
    #pageInfo { min-width:58px; font-size:13px; }
  }
</style>
</head>
<body>

<div id="world">
  <div class="sky dusk"></div>
  <div class="sky night"></div>
  <div id="stars"></div>
  <svg id="moon" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="#fff3c9"/>
    <circle cx="34" cy="36" r="7" fill="#e8d9a8" opacity=".7"/>
    <circle cx="63" cy="63" r="9" fill="#e8d9a8" opacity=".55"/>
    <circle cx="66" cy="30" r="4.5" fill="#e8d9a8" opacity=".6"/>
    <path d="M44 66 q-2 -8 3 -12 q4 -3 8 -1 q1 -6 5 -9 q2 -2 3 0 q1 2 -1 5 q-2 3 -2 5 q4 -1 6 2 q3 4 0 8 q-3 4 -10 4 q-8 0 -12 -2 z" fill="#c9b581" opacity=".85"/>
  </svg>
  <div id="hills"  class="scroller"></div>
  <div id="trees"  class="scroller"></div>
  <div id="poles"  class="scroller"></div>
  <div id="ground"></div>
  <div id="road"></div>
  <div id="oncoming"><span class="hl"></span><span class="hl"></span></div>
  <div id="glare"></div>
  <div id="frame"></div>
</div>

<div id="milestone">
  <div class="cap"></div>
  <div class="stone">
    <div class="place">అమ్మమ్మ ఊరు</div>
    <div class="km"><span id="kmVal">–</span> <small>కి.మీ</small></div>
  </div>
</div>
<div id="eraYear"></div>

<div id="stage">
  <div id="bookBob"><div id="bookShift">
    <div id="book">
      <div class="zone" id="zonePrev" title="వెనుక పేజీ"><div class="hint">‹</div></div>
      <div class="zone" id="zoneNext" title="తరువాత పేజీ"><div class="hint">›</div></div>
      <div id="castShadow"></div>
    </div>
  </div></div>
</div>

<div id="bar">
  <div id="progressTrack"><div id="progressFill"></div></div>
  <a class="btn" id="btnStall" href="./" title="బుక్ స్టాల్‌కు తిరిగి"><span class="ico">🏪</span><span class="txt"> స్టాల్</span></a>
  <button id="btnPrev" title="←"><span class="ico">‹</span><span class="txt"> వెనుకకు</span></button>
  <div id="pageInfo">…</div>
  <button id="btnNext" title="→"><span class="txt">ముందుకు </span><span class="ico">›</span></button>
  <button id="btnZoom" title="పెద్దది చేయండి"><span class="ico">🔍</span></button>
  <button id="btnThumbs" title="అన్ని పేజీలు"><span class="ico">☰</span><span class="txt"> పేజీలు</span></button>
  <button id="btnSound" title="శబ్దం"><span class="ico">🔊</span><span class="txt"> ప్రయాణం</span></button>
  <button id="btnFull" title="పూర్తి తెర"><span class="ico">⛶</span></button>
</div>

<div id="thumbs">
  <header>
    <span id="thumbsTitle">అన్ని పేజీలు</span>
    <button id="btnCloseThumbs">✕</button>
  </header>
  <div id="thumbGrid"></div>
</div>

<div id="zoomer">
  <img id="zoomImg" class="zpage" alt="" draggable="false">
  <div id="zoomHint">పించ్ చేసి పెద్దది చేయండి · రెండుసార్లు నొక్కండి</div>
  <div id="zoomBar">
    <button id="zoomPrevBtn" title="వెనుక పేజీ">‹</button>
    <span id="zoomInfo"></span>
    <button id="zoomNextBtn" title="తరువాత పేజీ">›</button>
    <button id="zoomCloseBtn" title="మూసివేయి">✕</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var AR = 1191 / 1872;           // page aspect ratio (w/h)

  var TOTAL = 0, SHEETS = 0, edition = null, base = '';
  var book = document.getElementById('book');
  var bookShift = document.getElementById('bookShift');
  var stage = document.getElementById('stage');
  var sheets = [];
  var cs = 0;                     // sheets turned (0..SHEETS)
  var narrow = false;             // single-page mode
  var side = 'right';             // which half is focused in narrow mode
  var soundOn = true;

  /* ---------- edition bootstrap ---------- */
  var params = new URLSearchParams(location.search);
  var edId = params.get('e');
  if (!edId){ location.replace('./'); return; }

  fetch('data/editions.json')
    .then(function(r){ if (!r.ok) throw new Error('manifest'); return r.json(); })
    .then(function(data){
      edition = (data.editions || []).find(function(e){ return e.id === edId; });
      if (!edition){ location.replace('./'); return; }
      var b = data.baseUrl || '';
      if (b && b.slice(-1) !== '/') b += '/';
      base = b + 'editions/' + edition.id;
      TOTAL = edition.pages;
      SHEETS = Math.ceil(TOTAL / 2);
      document.title = edition.title + ' · చందమామ';
      init();
    })
    .catch(function(){
      toast('సంచిక దొరకలేదు…');
      setTimeout(function(){ location.replace('./'); }, 1800);
    });

  function pad3(n){ return n < 10 ? '00'+n : (n < 100 ? '0'+n : ''+n); }
  function pageFile(n){ return base + '/pages/page-' + pad3(n) + '.webp'; }
  function thumbFile(n){ return base + '/thumbs/page-' + pad3(n) + '.webp'; }

  /* ---------- build sheets ---------- */
  function buildSheets(){
    for (var i=0; i<SHEETS; i++){
      var s = document.createElement('div');
      s.className = 'sheet';
      s.innerHTML =
        '<div class="face front"><div class="loading">చందమామ…</div><div class="shade"></div></div>' +
        '<div class="face back"><div class="loading">చందమామ…</div><div class="shade"></div></div>';
      s.dataset.front = 2*i+1;
      s.dataset.back  = 2*i+2;
      book.insertBefore(s, book.firstChild);
      sheets.push(s);
    }
  }

  function loadFace(sheet, cls, n){
    var face = sheet.querySelector('.face.'+cls);
    if (face.dataset.done) return;
    face.dataset.done = '1';
    var ld = face.querySelector('.loading');
    if (n > TOTAL){ if (ld) ld.remove(); return; }   /* odd page count: blank paper */
    var img = document.createElement('img');
    img.src = pageFile(n);
    img.alt = 'పేజీ ' + n;
    img.draggable = false;
    img.decoding = 'async';
    img.onload = function(){
      var l = face.querySelector('.loading');
      if (l) l.remove();
    };
    face.insertBefore(img, face.querySelector('.shade'));
  }
  function unloadFace(sheet, cls){
    var face = sheet.querySelector('.face.'+cls);
    if (!face.dataset.done) return;
    delete face.dataset.done;
    var img = face.querySelector('img');
    if (img) img.remove();
    if (!face.querySelector('.loading')){
      var ld = document.createElement('div');
      ld.className = 'loading'; ld.textContent = 'చందమామ…';
      face.insertBefore(ld, face.firstChild);
    }
  }
  /* iOS kills the page if too many decoded images / GPU layers pile up:
     keep a small window of sheets loaded, unload the rest, and take
     far-away sheets out of the compositor entirely. */
  function ensureWindowLoaded(){
    var from = Math.max(0, cs-2), to = Math.min(SHEETS-1, cs+4);
    var vFrom = Math.max(0, from-2), vTo = Math.min(SHEETS-1, to+2);
    for (var i=0; i<SHEETS; i++){
      var s = sheets[i];
      if (i >= from && i <= to){
        s.style.display = '';
        loadFace(s,'front', +s.dataset.front);
        loadFace(s,'back',  +s.dataset.back);
      } else {
        s.style.display = (i < vFrom || i > vTo) ? 'none' : '';
        unloadFace(s,'front');
        unloadFace(s,'back');
      }
    }
  }

  /* ---------- layout ---------- */
  function layout(){
    var barEl = document.getElementById('bar');
    var barH = (barEl && barEl.offsetHeight) || 56;
    var availH = window.innerHeight - barH - 40;
    var availW = window.innerWidth - 40;
    narrow = (availW < availH * AR * 1.7);
    var ph, pw;
    if (!narrow){
      ph = Math.min(availH * 0.92, (availW * 0.84 / 2) / AR);
      pw = ph * AR;
    } else {
      ph = Math.min(availH * 0.88, (availW * 0.92) / AR);
      pw = ph * AR;
    }
    document.documentElement.style.setProperty('--pw', pw+'px');
    document.documentElement.style.setProperty('--ph', ph+'px');
    document.body.classList.toggle('narrow', narrow);
    if (narrow){
      bookShift.style.width = pw+'px';
      applyShift(false);
    } else {
      bookShift.style.width = '';
      bookShift.style.transform = '';
    }
  }
  function applyShift(animate){
    if (!narrow) return;
    var pw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
    bookShift.style.transition = animate ? '' : 'none';
    bookShift.style.transform = (side === 'right') ? 'translateX('+(-pw)+'px)' : 'translateX(0)';
    if (!animate){ void bookShift.offsetWidth; bookShift.style.transition=''; }
  }

  /* ---------- z-index + classes ---------- */
  function paint(instant){
    for (var i=0;i<SHEETS;i++){
      var s = sheets[i];
      if (instant) s.classList.add('no-anim');
      if (i < cs){ s.classList.add('turned'); s.style.zIndex = 10 + i; }
      else { s.classList.remove('turned'); s.style.zIndex = 10 + (SHEETS - i); }
    }
    if (instant){
      void book.offsetWidth;
      for (var j=0;j<SHEETS;j++) sheets[j].classList.remove('no-anim');
    }
    updateHud();
    ensureWindowLoaded();
    save();
  }
  function raiseDuringTurn(i){
    sheets[i].style.zIndex = 400;
    sheets[i].style.willChange = 'transform';
    sheets[i].style.setProperty('--ts', '0.55');
    (function(sh){
      var done = function(){
        sh.removeEventListener('transitionend', done);
        sh.style.willChange = '';
        sh.style.setProperty('--ts', '0');
        paint(false);
      };
      sh.addEventListener('transitionend', done);
      setTimeout(done, 1000);
    })(sheets[i]);
  }

  /* ---------- navigation ---------- */
  function visiblePage(){
    if (narrow) return side==='right' ? Math.min(TOTAL, 2*cs+1) : Math.max(1, 2*cs);
    return Math.max(1, Math.min(TOTAL, cs===0 ? 1 : 2*cs));
  }
  function next(){
    if (narrow){
      if (side === 'right'){
        if (cs >= SHEETS) return;
        cs++; raiseDuringTurn(cs-1); sheets[cs-1].classList.add('turned');
        side = 'left'; applyShift(true); sfxFlip();
      } else {
        if (2*cs+1 > TOTAL) return;
        side = 'right'; applyShift(true);
      }
      updateHud(); ensureWindowLoaded(); save();
    } else {
      if (cs >= SHEETS) return;
      cs++; raiseDuringTurn(cs-1); sheets[cs-1].classList.add('turned');
      sfxFlip(); updateHud(); ensureWindowLoaded(); save();
    }
  }
  function prev(){
    if (narrow){
      if (side === 'left'){
        cs--; raiseDuringTurn(cs); sheets[cs].classList.remove('turned');
        side = 'right'; applyShift(true); sfxFlip();
      } else {
        if (cs === 0) return;
        side = 'left'; applyShift(true);
      }
      updateHud(); ensureWindowLoaded(); save();
    } else {
      if (cs === 0) return;
      cs--; raiseDuringTurn(cs); sheets[cs].classList.remove('turned');
      sfxFlip(); updateHud(); ensureWindowLoaded(); save();
    }
  }
  function goToPage(p){
    p = Math.max(1, Math.min(TOTAL, p));
    cs = Math.floor(p/2);
    if (narrow) side = (p % 2 === 1) ? 'right' : 'left';
    paint(true);
    applyShift(false);
  }

  /* ---------- HUD ---------- */
  var kmVal = document.getElementById('kmVal');
  var milestone = document.getElementById('milestone');
  var pageInfo = document.getElementById('pageInfo');
  var progressFill = document.getElementById('progressFill');
  function updateHud(){
    var p = visiblePage();
    var km = TOTAL - p;
    var prog = TOTAL > 1 ? (p-1)/(TOTAL-1) : 1;
    journeyProg = prog;
    document.documentElement.style.setProperty('--prog', prog.toFixed(3));
    if (km <= 0){
      milestone.classList.add('home');
      milestone.querySelector('.place').textContent = 'వచ్చేశాం! 🏡';
      kmVal.parentNode.style.display='none';
    } else {
      milestone.classList.remove('home');
      milestone.querySelector('.place').textContent = 'అమ్మమ్మ ఊరు';
      kmVal.parentNode.style.display='';
      kmVal.textContent = km;
    }
    milestone.classList.add('bump');
    setTimeout(function(){ milestone.classList.remove('bump'); }, 320);
    if (!narrow && cs>0 && cs<SHEETS) pageInfo.textContent = (2*cs) + '–' + Math.min(TOTAL, 2*cs+1) + ' / ' + TOTAL;
    else pageInfo.textContent = p + ' / ' + TOTAL;
    progressFill.style.width = (prog*100)+'%';
  }
  function save(){
    try {
      var p = visiblePage();
      localStorage.setItem('cm-' + edition.id, String(p));
      var recent = [];
      try { recent = JSON.parse(localStorage.getItem('cm-recent') || '[]'); } catch(e){}
      recent = recent.filter(function(r){ return r.id !== edition.id; });
      recent.unshift({ id: edition.id, page: p, when: Date.now() });
      localStorage.setItem('cm-recent', JSON.stringify(recent.slice(0, 12)));
    } catch(e){}
  }

  /* ---------- eras: how old is the bus you boarded? ---------- */
  var ERA = { name:'modern', lp:95, hum:46, lfoRate:0.35, lfoDepth:3.5, horn:[438,552], hornLen:1.0 };
  var ERAS = {
    vintage: { name:'vintage', lp:72,  hum:39, lfoRate:0.6,  lfoDepth:7.5, horn:[365],     hornLen:1.35 },
    classic: { name:'classic', lp:82,  hum:43, lfoRate:0.45, lfoDepth:5.5, horn:[398,502], hornLen:1.15 },
    retro:   { name:'retro',   lp:90,  hum:45, lfoRate:0.4,  lfoDepth:4.5, horn:[425,540], hornLen:1.05 },
    modern:  { name:'modern',  lp:95,  hum:46, lfoRate:0.35, lfoDepth:3.5, horn:[438,552], hornLen:1.0  }
  };
  function eraFor(year){
    if (year < 1960) return 'vintage';
    if (year < 1980) return 'classic';
    if (year < 2000) return 'retro';
    return 'modern';
  }
  function applyEra(year){
    var key = params.get('era');                 /* ?era=vintage lets you preview any era */
    if (!key || !ERAS[key]) key = eraFor(year);
    ERA = ERAS[key];
    document.body.classList.remove('era-vintage','era-classic','era-retro');
    if (key !== 'modern') document.body.classList.add('era-' + key);
    document.getElementById('eraYear').textContent = '· ' + year + ' ·';
  }

  /* ---------- audio (all synthesized) ---------- */
  var AC = null, masterGain = null, rumbleGain = null;
  function initAudio(){
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);
      var len = AC.sampleRate * 2.5;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0), last = 0;
      for (var i=0;i<len;i++){
        var w = Math.random()*2-1;
        last = (last + 0.02*w)/1.02;
        data[i] = last * 3.2;
      }
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = ERA.lp; lp.Q.value = 0.6;
      rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
      src.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(masterGain);
      src.start();
      var osc = AC.createOscillator(); osc.type='sine'; osc.frequency.value = ERA.hum;
      var og = AC.createGain(); og.gain.value = 0.035;
      var lfo = AC.createOscillator(); lfo.frequency.value = ERA.lfoRate;
      var lg = AC.createGain(); lg.gain.value = ERA.lfoDepth;
      lfo.connect(lg); lg.connect(osc.frequency);
      osc.connect(og); og.connect(rumbleGain);
      osc.start(); lfo.start();
    } catch(e){ AC = null; }
  }
  function rumbleTo(v){
    if (!AC || !rumbleGain) return;
    rumbleGain.gain.cancelScheduledValues(AC.currentTime);
    rumbleGain.gain.linearRampToValueAtTime(v, AC.currentTime + 1.5);
  }
  function sfxHorn(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime, L = ERA.hornLen;
    ERA.horn.forEach(function(f){
      var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      var bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.6; bp.Q.value = 1.6;
      var g = AC.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.055, t+0.05);
      g.gain.setValueAtTime(0.055, t+0.42*L);
      g.gain.linearRampToValueAtTime(0, t+0.6*L);
      g.gain.linearRampToValueAtTime(0.05, t+0.72*L);
      g.gain.setValueAtTime(0.05, t+1.1*L);
      g.gain.linearRampToValueAtTime(0, t+1.35*L);
      o.connect(bp); bp.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t+1.4*L);
    });
  }
  function sfxFlip(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime;
    var len = AC.sampleRate * 0.4;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.5);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(700, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t+0.18);
    bp.frequency.exponentialRampToValueAtTime(900, t+0.38);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    src.start(t);
  }
  function sfxWhoosh(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime;
    var len = Math.floor(AC.sampleRate * 2.2);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
    var src = AC.createBufferSource(); src.buffer = buf;
    var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(220, t);
    lp.frequency.linearRampToValueAtTime(900, t+1.4);   /* doppler-ish rise then fall */
    lp.frequency.linearRampToValueAtTime(160, t+2.1);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t+1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t+2.2);
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(t);
  }
  function sfxChirp(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime;
    for (var k=0;k<3;k++){
      var o = AC.createOscillator(); o.type='sine';
      o.frequency.value = 4100 + Math.random()*400;
      var g = AC.createGain();
      var t0 = t + k*0.075;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.011, t0+0.012);
      g.gain.linearRampToValueAtTime(0, t0+0.05);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0+0.06);
    }
  }
  /* ambient schedulers: an oncoming bus every so often; crickets near the village */
  var oncomingEl = document.getElementById('oncoming');
  function scheduleOncoming(){
    setTimeout(function(){
      if (edition && !document.hidden && !document.body.classList.contains('paused')){
        oncomingEl.classList.remove('pass');
        void oncomingEl.offsetWidth;
        oncomingEl.classList.add('pass');
        sfxWhoosh();
      }
      scheduleOncoming();
    }, 16000 + Math.random()*22000);
  }
  scheduleOncoming();
  var journeyProg = 0;
  function scheduleCrickets(){
    setTimeout(function(){
      if (journeyProg > 0.62 && !document.hidden) sfxChirp();
      scheduleCrickets();

  /* ---------- thumbnails ---------- */
  var thumbs = document.getElementById('thumbs');

  function buildThumbs(){
    if (thumbsBuilt) return;

      var th = document.createElement('div');

  /* ---------- zoom (pinch / double-tap / wheel) ---------- */
  var zoomer = document.getElementById('zoomer');
  var zoomImg = document.getElementById('zoomImg');
  var zoomInfo = document.getElementById('zoomInfo');
  var zoomHint = document.getElementById('zoomHint');
  var zoomPage = 1, zs = 1, ztx = 0, zty = 0, fitW = 0, fitH = 0;
  var zoomOpen = false;

  function zoomRender(){
    zoomImg.style.width = fitW + 'px';
    zoomImg.style.transform = 'translate('+ztx+'px,'+zty+'px) scale('+zs+')';
  }
  function zoomFit(){
    var W = window.innerWidth, H = window.innerHeight;
    fitW = Math.min(W, H * AR); fitH = fitW / AR;
    zs = 1; ztx = (W - fitW)/2; zty = (H - fitH)/2;
    zoomRender();
  }
  function zoomClamp(){
    var W = window.innerWidth, H = window.innerHeight;
    var w = fitW * zs, h = fitH * zs;
    if (w <= W) ztx = (W - w)/2; else ztx = Math.max(W - w, Math.min(0, ztx));
    if (h <= H) zty = (H - h)/2; else zty = Math.max(H - h, Math.min(0, zty));
  }
  function openZoom(p){
    zoomPage = Math.max(1, Math.min(TOTAL, p));
    zoomImg.src = pageFile(zoomPage);
    zoomInfo.textContent = zoomPage + ' / ' + TOTAL;
    zoomer.classList.add('open');
    zoomOpen = true;
    zoomHint.classList.remove('faded');
    setTimeout(function(){ zoomHint.classList.add('faded'); }, 2600);
    zoomFit();
  }
  function closeZoom(){
    zoomer.classList.remove('open');
    zoomOpen = false;
    if (edition && zoomPage !== visiblePage()) goToPage(zoomPage);
  }
  var zAnim = false;
  function zoomStep(d){
    var p = Math.max(1, Math.min(TOTAL, zoomPage + d));
    if (p === zoomPage || zAnim) return;
    zAnim = true;
    zs = 1; zoomFit();                       /* flip happens at fit scale */
    var atRest = 'translate('+ztx+'px,'+zty+'px)';
    var turned = 'translate('+ztx+'px,'+zty+'px) rotateY(-150deg)';
    var inc = document.createElement('img');
    inc.className = 'zpage';
    inc.alt = ''; inc.draggable = false;
    inc.style.width = fitW + 'px';
    inc.style.transformOrigin = 'left center';
    inc.style.transform = (d > 0) ? atRest : turned;
    if (d < 0) inc.style.opacity = '0.1';
    var fallback = setTimeout(finish, 1200); /* never strand the view on a slow page */
    inc.onload = function(){
      clearTimeout(fallback);
      if (d > 0) zoomer.insertBefore(inc, zoomImg);      /* new page waits beneath */
      else zoomer.insertBefore(inc, zoomImg.nextSibling); /* new page flips in on top */
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        sfxFlip();
        if (d > 0){
          zoomImg.classList.add('zflip');
          zoomImg.style.transformOrigin = 'left center';
          zoomImg.style.transform = turned;
          zoomImg.style.opacity = '0.1';
        } else {
          inc.classList.add('zflip');
          inc.style.transform = atRest;
          inc.style.opacity = '1';
        }
        setTimeout(finish, 560);
      });});
    };
    inc.onerror = function(){ clearTimeout(fallback); finish(); };
    function finish(){
      if (!zAnim) return;
      if (inc.parentNode){
        zoomImg.remove();
        inc.classList.remove('zflip');
        inc.id = 'zoomImg';
        zoomImg = inc;
      } else {
        zoomImg.src = inc.src;               /* fallback path: plain swap */
      }
      zoomPage = p;
      zoomInfo.textContent = p + ' / ' + TOTAL;
      zAnim = false;
      zoomFit();
    }
    inc.src = pageFile(p);
  }
  document.getElementById('btnZoom').addEventListener('click', function(){ if (edition) openZoom(visiblePage()); });
  document.getElementById('zoomCloseBtn').addEventListener('click', closeZoom);
  document.getElementById('zoomPrevBtn').addEventListener('click', function(){ zoomStep(-1); });
  document.getElementById('zoomNextBtn').addEventListener('click', function(){ zoomStep(1); });
  window.addEventListener('resize', function(){ if (zoomOpen) zoomFit(); });

  var zPointers = new Map();
  var pinch0 = null;
  zoomer.addEventListener('pointerdown', function(e){
    if (zAnim) return;
    if (e.target.closest && e.target.closest('#zoomBar')) return;
    if (zoomer.setPointerCapture){ try { zoomer.setPointerCapture(e.pointerId); } catch(err){} }
    zPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    zSwipeX = (zPointers.size === 1) ? e.clientX : null;
    if (zPointers.size === 2){
      var pts = Array.from(zPointers.values());
      pinch0 = {
        d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1,
        mx:(pts[0].x+pts[1].x)/2, my:(pts[0].y+pts[1].y)/2,
        s: zs, tx: ztx, ty: zty
      };
    }
  });
  zoomer.addEventListener('pointermove', function(e){
    if (zAnim) return;
    var p = zPointers.get(e.pointerId);
    if (!p) return;
    var px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (zPointers.size === 2 && pinch0){
      var pts = Array.from(zPointers.values());
      var d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var mx = (pts[0].x+pts[1].x)/2, my = (pts[0].y+pts[1].y)/2;
      var ns = Math.max(1, Math.min(6, pinch0.s * (d / pinch0.d)));
      ztx = mx - (pinch0.mx - pinch0.tx) * (ns / pinch0.s);
      zty = my - (pinch0.my - pinch0.ty) * (ns / pinch0.s);
      zs = ns;
      zoomClamp(); zoomRender();
    } else if (zPointers.size === 1){
      ztx += e.clientX - px; zty += e.clientY - py;
      zoomClamp(); zoomRender();
    }
  });
  function zEnd(e){
    zPointers.delete(e.pointerId);
    if (zPointers.size < 2) pinch0 = null;
  }
  zoomer.addEventListener('pointerup', zEnd);
  zoomer.addEventListener('pointercancel', zEnd);

  function zoomToggleAt(x, y){
    if (zAnim) return;
    zoomImg.style.transition = 'transform .28s ease';
    setTimeout(function(){ zoomImg.style.transition = ''; }, 300);
    if (zs > 1.05){ zoomFit(); return; }
    var ns = 2.6;
    ztx = x - (x - ztx) * (ns / zs);
    zty = y - (y - zty) * (ns / zs);
    zs = ns; zoomClamp(); zoomRender();
  }
  var zLastTap = 0, zLastX = 0, zLastY = 0, zSwipeX = null;
  zoomer.addEventListener('pointerup', function(e){
    if (e.target.closest && e.target.closest('#zoomBar')) return;
    /* at fit scale a horizontal swipe turns the page (zoomed-in swipes pan instead) */
    if (zSwipeX !== null && zs <= 1.05 && !zAnim){
      var sdx = e.clientX - zSwipeX;
      if (Math.abs(sdx) > 55){
        zSwipeX = null; zLastTap = 0;
        zoomStep(sdx < 0 ? 1 : -1);
        return;
      }
    }
    zSwipeX = null;
    var now = Date.now();
    if (now - zLastTap < 320 && Math.hypot(e.clientX-zLastX, e.clientY-zLastY) < 30){
      zoomToggleAt(e.clientX, e.clientY);
      zLastTap = 0;
    } else { zLastTap = now; zLastX = e.clientX; zLastY = e.clientY; }
  });
  zoomer.addEventListener('wheel', function(e){
    e.preventDefault();
    if (zAnim) return;
    var ns = Math.max(1, Math.min(6, zs * (e.deltaY < 0 ? 1.15 : 0.87)));
    ztx = e.clientX - (e.clientX - ztx) * (ns / zs);
    zty = e.clientY - (e.clientY - zty) * (ns / zs);
    zs = ns; zoomClamp(); zoomRender();
  }, {passive:false});

  /* block native page zoom — the in-reader zoom replaces it */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  /* ---------- controls ---------- */
  document.getElementById('zoneNext').addEventListener('click', next);
  document.getElementById('zonePrev').addEventListener('click', prev);
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.addEventListener('keydown', function(e){
    if (!edition) return;
    if (zoomOpen){
      if (e.key==='Escape') closeZoom();
      else if (e.key==='ArrowRight'){ e.preventDefault(); zoomStep(1); }
      else if (e.key==='ArrowLeft'){ e.preventDefault(); zoomStep(-1); }
      return;
    }
    if (thumbs.classList.contains('open')){
      if (e.key==='Escape') thumbs.classList.remove('open');
      return;
    }
    if (e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if (e.key==='Home'){ goToPage(1); }
    else if (e.key==='End'){ goToPage(TOTAL); }
  });
  /* ---------- drag-to-flip: the page follows your finger ---------- */
  var activePts = new Map();
  var tapT = 0, tapX = 0, tapY = 0;
  var drag = null;            /* active drag: {pending,id,x0,y0,kind,dir,idx,sheet,t,samples} */
  var turning = false;        /* a released leaf is mid-transition */
  var suppressClick = false, suppressTimer = null;
  var castShadow = document.getElementById('castShadow');

  function pageW(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw')) || 300; }
  function shadeTo(sheet, t){
    sheet.style.setProperty('--ts', (Math.sin(Math.PI * t) * 0.9).toFixed(3));
    castShadow.style.opacity = (Math.sin(Math.PI * t) * 0.75).toFixed(3);
  }

  function beginLeafDrag(dir){
    var idx = dir > 0 ? cs : cs - 1;
    var s = sheets[idx];
    s.classList.add('dragging');
    s.style.zIndex = 400;
    s.style.willChange = 'transform';
    castShadow.className = dir > 0 ? 'left' : 'right';
    castShadow.style.transition = 'none';
    return { kind:'leaf', dir:dir, idx:idx, sheet:s, t:0 };
  }
  function moveLeafDrag(d, dx){
    var t = Math.max(0, Math.min(1, (d.dir > 0 ? -dx : dx) / (pageW() * 1.15)));
    d.t = t;
    var ang = d.dir > 0 ? -180 * t : -180 + 180 * t;
    d.sheet.style.transform = 'rotateY(' + ang + 'deg)';
    shadeTo(d.sheet, t);
  }
  function endLeafDrag(d, commit){
    var s = d.sheet;
    s.style.setProperty('--ts', '0');
    castShadow.style.transition = '';
    castShadow.style.opacity = '0';
    var instant = commit ? d.t > 0.98 : d.t < 0.02;
    s.classList.remove('dragging');
    if (commit){
      if (d.dir > 0){ cs++; s.classList.add('turned'); if (narrow) side = 'left'; }
      else { cs--; s.classList.remove('turned'); if (narrow) side = 'right'; }
      if (narrow) applyShift(true);
      sfxFlip(); updateHud(); ensureWindowLoaded(); save();
    }
    if (instant){
      s.style.transform = '';
      s.style.willChange = '';
      paint(true);
      return;
    }
    void s.offsetWidth;                /* transition resumes from the held angle */
    s.style.transform = '';
    turning = true;
    var done = function(){
      s.removeEventListener('transitionend', done);
      turning = false;
      s.style.willChange = '';
      paint(false);
    };
    s.addEventListener('transitionend', done);
    setTimeout(done, 1000);
  }

  function beginSlideDrag(dir){
    bookShift.style.transition = 'none';
    return { kind:'slide', dir:dir, t:0 };
  }
  function moveSlideDrag(d, dx){
    var w = pageW();
    var t = Math.max(0, Math.min(1, (d.dir > 0 ? -dx : dx) / w));
    d.t = t;
    var from = d.dir > 0 ? 0 : -w;
    bookShift.style.transform = 'translateX(' + (from + (d.dir > 0 ? -w * t : w * t)) + 'px)';
  }
  function endSlideDrag(d, commit){
    bookShift.style.transition = '';
    if (commit){
      side = d.dir > 0 ? 'right' : 'left';
      updateHud(); ensureWindowLoaded(); save();
    }
    applyShift(true);
  }

  function releaseDrag(d, commit){
    if (d.kind === 'leaf') endLeafDrag(d, commit);
    else endSlideDrag(d, commit);
  }
  function dragVelocity(d){
    var s = d.samples;
    if (s.length < 2) return 0;
    var a = s[0], b = s[s.length - 1];
    var dt = b.tm - a.tm;
    return dt > 0 ? (b.x - a.x) / dt : 0;
  }

  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){
      if (zoomOpen || !edition) return;
      activePts.set(e.pointerId, true);
      if (activePts.size === 2 && e.target.closest && e.target.closest('#stage')){
        if (drag){ var d0 = drag; drag = null; if (!d0.pending) releaseDrag(d0, false); }
        openZoom(visiblePage());    /* two-finger touch on the page = zoom */
        return;
      }
      if (turning || drag || activePts.size > 1) return;
      if (!(e.target.closest && e.target.closest('#stage'))) return;
      drag = { pending:true, id:e.pointerId, x0:e.clientX, y0:e.clientY, t:0,
               samples:[{x:e.clientX, tm:e.timeStamp}] };
    }, {passive:true});

    document.addEventListener('pointermove', function(e){
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x0;
      drag.samples.push({x:e.clientX, tm:e.timeStamp});
      if (drag.samples.length > 5) drag.samples.shift();
      if (drag.pending){
        if (Math.abs(dx) < 8) return;
        var forward = dx < 0, sub = null;
        if (narrow){
          if (forward){
            if (side === 'right'){ if (cs < SHEETS) sub = beginLeafDrag(1); }
            else if (2*cs + 1 <= TOTAL) sub = beginSlideDrag(1);
          } else {
            if (side === 'left'){ if (cs > 0) sub = beginLeafDrag(-1); }
            else if (cs > 0) sub = beginSlideDrag(-1);
          }
        } else {
          if (forward){ if (cs < SHEETS) sub = beginLeafDrag(1); }
          else if (cs > 0) sub = beginLeafDrag(-1);
        }
        if (!sub){ drag = null; return; }
        for (var k in sub) drag[k] = sub[k];
        drag.pending = false;
        suppressClick = true;
        clearTimeout(suppressTimer);
        suppressTimer = setTimeout(function(){ suppressClick = false; }, 600);
      }
      if (drag.kind === 'leaf') moveLeafDrag(drag, dx);
      else moveSlideDrag(drag, dx);
    }, {passive:true});

    document.addEventListener('pointerup', function(e){
      activePts.delete(e.pointerId);
      if (zoomOpen) return;
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      if (d.pending){
        /* it was a tap: double-tap on the open page = zoom */
        if (edition && e.target.closest && e.target.closest('#stage') && !e.target.closest('.zone')){
          var now = Date.now();
          if (now - tapT < 320 && Math.hypot(e.clientX-tapX, e.clientY-tapY) < 30){
            openZoom(visiblePage()); tapT = 0;
          } else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
        }
        return;
      }
      var v = dragVelocity(d);                       /* px/ms, negative = leftward */
      var fling = d.dir > 0 ? v < -0.5 : v > 0.5;
      releaseDrag(d, d.t > 0.28 || fling);
    }, {passive:true});

    document.addEventListener('pointercancel', function(e){
      activePts.delete(e.pointerId);
      if (drag && e.pointerId === drag.id){
        var d = drag; drag = null;
        if (!d.pending) releaseDrag(d, false);
      }
    }, {passive:true});

    /* a drag must not also fire the tap zones underneath it */
    document.addEventListener('click', function(e){
      if (suppressClick){
        e.stopPropagation(); e.preventDefault();
        suppressClick = false;
        clearTimeout(suppressTimer);
      }
    }, true);
  } else {
    var swipeX = null;
    document.addEventListener('touchstart', function(e){ if (!zoomOpen) swipeX = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', function(e){
      if (swipeX === null || !edition || zoomOpen) return;
      var dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
      if (Math.abs(dx) > 45){ if (dx < 0) next(); else prev(); }
    }, {passive:true});
  }

  var btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', function(){
    soundOn = !soundOn;
    btnSound.querySelector('.ico').textContent = soundOn ? '🔊' : '🔇';
    document.body.classList.toggle('paused', !soundOn);
    if (soundOn){ initAudio(); if (AC && AC.state==='suspended') AC.resume(); rumbleTo(0.12); }
    else rumbleTo(0);
  });
  document.getElementById('btnFull').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });

  /* ---------- boot ---------- */
  function init(){
    applyEra(edition.year);
    document.getElementById('thumbsTitle').textContent = 'అన్ని పేజీలు · ' + edition.title;
    buildSheets();
    layout();
    var saved = 1;
    try { saved = parseInt(localStorage.getItem('cm-' + edition.id) || '1', 10) || 1; } catch(e){}
    if (saved > 1 && saved <= TOTAL){
      goToPage(saved);
      toast('మీరు ఆగిన చోటు నుండి… పేజీ ' + saved);
    } else {
      paint(true);
    }
    window.addEventListener('resize', function(){ layout(); paint(true); });
  }
})();
</script>
</body>
</html>
