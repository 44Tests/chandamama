<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>చందమామ · The Bus Journey</title>
<style>
  :root {
    --tel: "Kohinoor Telugu", "Telugu MN", "Noto Sans Telugu", "Gautami", sans-serif;
    --eng: Georgia, "Times New Roman", serif;
    --pw: 300px;   /* one page width  */
    --ph: 472px;   /* one page height */
    --prog: 0;     /* journey progress 0..1 */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b1026; }
  body { font-family: var(--eng); -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none; }
  button, .zone, .th, a { touch-action: manipulation; }

  /* ============ SKY & LANDSCAPE ============ */
  #world { position:fixed; inset:0; overflow:hidden; }
  .sky { position:absolute; inset:0; }
  .sky.dusk {
    background: linear-gradient(to bottom,
      #2b2a5e 0%, #5b3d78 34%, #a75a6d 58%, #e08850 76%, #f4b167 88%, #f9cf8a 100%);
  }
  .sky.night {
    background: linear-gradient(to bottom,
      #05070f 0%, #0a1030 40%, #1a2352 68%, #35386e 85%, #4d4470 100%);
    opacity: var(--prog);
    transition: opacity 1.2s ease;
  }
  #stars { position:absolute; inset:0; opacity: calc(0.25 + var(--prog) * 0.75); transition: opacity 1.2s ease; }
  .star { position:absolute; background:#fff; border-radius:50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.9} 50%{opacity:.25} }

  #moon {
    position:absolute; right:9%; width:min(11vmin,92px); aspect-ratio:1;
    top: calc(30% - var(--prog) * 18%);
    transition: top 1.4s ease;
    filter: drop-shadow(0 0 24px rgba(255,244,200,.55)) drop-shadow(0 0 70px rgba(255,244,200,.25));
  }

  .scroller { position:absolute; left:0; right:0; background-repeat:repeat-x; }
  #hills   { bottom:14%; height:24%; background-size:auto 100%; animation: roll 95s linear infinite; opacity:.85; }
  #trees   { bottom:11%; height:34%; background-size:auto 100%; animation: roll 34s linear infinite; }
  #poles   { bottom:9%;  height:52%; background-size:auto 100%; animation: roll 15s linear infinite; }
  #ground  { bottom:0; height:12%;
    background: linear-gradient(to bottom, #14101f, #060409);
  }
  #road { bottom:6.5%; height:3%;
    background: repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,230,170,.35) 90px 150px);
    background-size: 300px 3px; background-position: 0 55%; background-repeat: repeat-x;
    animation: roll 1.6s linear infinite;
    opacity:.5;
  }
  @keyframes roll { from { background-position-x: 0; } to { background-position-x: -1200px; } }
  .paused .scroller, .paused #road { animation-play-state: paused; }

  #frame { position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 0 10px #17131f, inset 0 0 0 13px #2c2438, inset 0 0 120px rgba(0,0,0,.65);
  }
  #frame::before { content:""; position:absolute; inset:10px; border-radius:18px;
    box-shadow: inset 0 0 0 3px rgba(90,80,110,.5), inset 0 30px 80px rgba(255,255,255,.045);
  }
  #glare { position:absolute; inset:0; pointer-events:none; opacity:.5;
    background: linear-gradient(112deg, transparent 42%, rgba(255,255,255,.05) 46%, rgba(255,255,255,.10) 48%, transparent 55%, transparent 70%, rgba(255,255,255,.05) 74%, transparent 79%);
  }

  /* ============ MILESTONE HUD ============ */
  #milestone {
    position:fixed; top:26px; left:26px; z-index:40;
    width:128px; text-align:center; color:#1c1a14;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.5));
    transition: transform .3s ease;
    font-family: var(--tel);
  }
  #milestone .stone {
    background:#f3ead2; border-radius:60px 60px 8px 8px; padding:14px 8px 10px;
    border:2px solid #d9cba4;
  }
  #milestone .cap { height:26px; background:#e9b31a; border-radius:60px 60px 0 0; margin:-16px -10px 8px; border:2px solid #c1920e; }
  #milestone .place { font-size:14px; font-weight:700; line-height:1.3; }
  #milestone .km { font-size:22px; font-weight:800; margin-top:2px; }
  #milestone .km small { font-size:12px; font-weight:600; }
  #milestone.bump { transform: scale(1.08) rotate(-1.5deg); }
  #milestone.home .cap { background:#3fae5a; border-color:#2c8443; }

  /* ============ STAGE / BOOK ============ */
  #stage {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:20; padding-bottom:64px;
  }
  #bookBob { animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(0.06deg); }
    30%     { transform: translateY(-1.5px) rotate(-0.05deg); }
    62%     { transform: translateY(0.8px) rotate(0.04deg); }
    78%     { transform: translateY(-0.6px) rotate(0deg); }
  }
  #bookShift { transition: transform .55s cubic-bezier(.4,.1,.2,1); }
  #book {
    position:relative; width: calc(var(--pw) * 2); height: var(--ph);
    perspective: 2800px;
  }
  #book::after {
    content:""; position:absolute; left:4%; right:4%; bottom:-26px; height:40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);
    z-index:-1;
  }
  .sheet {
    position:absolute; left:50%; top:0; width:50%; height:100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 850ms cubic-bezier(.36,.08,.22,1);
  }
  .sheet.no-anim { transition: none !important; }
  .sheet.turned { transform: rotateY(-180deg); }
  .face {
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:#f6efdd; overflow:hidden;
    border-radius: 0 6px 6px 0;
    box-shadow: inset 0 0 30px rgba(120,90,40,.12);
  }
  .face.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px; }
  .face img { width:100%; height:100%; object-fit:cover; display:block; }
  .face .shade { position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(to right, rgba(60,40,10,.18), transparent 14%);
  }
  .face.back .shade { background: linear-gradient(to left, rgba(60,40,10,.18), transparent 14%); }
  .face .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#b9a77f; font-family:var(--tel); font-size:14px; }

  .zone { position:absolute; top:0; bottom:0; width:22%; z-index:30; cursor:pointer; }
  #zonePrev { left:-6%; } #zoneNext { right:-6%; }
  .zone:hover .hint { opacity:.9; }
  .zone .hint { position:absolute; top:50%; transform:translateY(-50%); opacity:0; transition:opacity .25s;
    width:38px; height:38px; border-radius:50%; background:rgba(20,16,30,.55); color:#f4e6c2;
    display:flex; align-items:center; justify-content:center; font-size:18px; backdrop-filter: blur(2px); }
  #zonePrev .hint { left:8px; } #zoneNext .hint { right:8px; }

  /* ============ CONTROL BAR ============ */
  #bar {
    position:fixed; left:0; right:0; bottom:0; height:56px; z-index:50;
    display:flex; align-items:center; justify-content:center; gap:14px;
    background: linear-gradient(to bottom, #241d31, #171221);
    box-shadow: 0 -6px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    color:#e8dcc0;
  }
  #bar button, #bar a.btn {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); color:#e8dcc0;
    border-radius:9px; padding:7px 13px; font-size:14px; cursor:pointer; font-family:var(--tel);
    transition: background .2s; text-decoration:none; display:inline-block;
  }
  #bar button:hover, #bar a.btn:hover { background:rgba(255,255,255,.14); }
  #pageInfo { font-family:var(--tel); font-size:14px; min-width:90px; text-align:center; letter-spacing:.5px; }
  #progressTrack { position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.08); }
  #progressFill { height:100%; width:0%; background:linear-gradient(90deg,#e9b31a,#f4d574); transition:width .5s ease;
    box-shadow: 0 0 8px rgba(233,179,26,.7); }

  /* ============ THUMBNAILS ============ */
  #thumbs {
    position:fixed; inset:0; z-index:80; background:rgba(8,6,16,.93); backdrop-filter: blur(6px);
    display:none; flex-direction:column; padding:20px;
  }
  #thumbs.open { display:flex; }
  #thumbs header { display:flex; justify-content:space-between; align-items:center; color:#f0e4c4;
    font-family:var(--tel); font-size:18px; padding:0 6px 14px; }
  #thumbs header button { background:none; border:none; color:#f0e4c4; font-size:26px; cursor:pointer; }
  #thumbGrid { flex:1; overflow-y:auto; display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap:12px; padding:4px; }
  #thumbGrid .th { cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid transparent; position:relative;
    aspect-ratio: 1191/1872; background:#241f33; transition: transform .15s; }
  #thumbGrid .th:hover { transform: scale(1.04); border-color:#e9b31a; }
  #thumbGrid .th.current { border-color:#e9b31a; box-shadow:0 0 12px rgba(233,179,26,.5); }
  #thumbGrid .th img { width:100%; height:100%; object-fit:cover; display:block; }
  #thumbGrid .th span { position:absolute; bottom:4px; right:6px; background:rgba(0,0,0,.65); color:#ffe9ad;
    font-size:11px; padding:1px 6px; border-radius:8px; font-family:var(--tel); }

  /* ============ ZOOM ============ */
  #zoomer { position:fixed; inset:0; z-index:95; background:rgba(6,5,12,.97); display:none;
    overflow:hidden; touch-action:none; }
  #zoomer.open { display:block; }
  #zoomImg { position:absolute; left:0; top:0; transform-origin:0 0; background:#f6efdd;
    user-select:none; -webkit-user-drag:none; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #zoomBar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; align-items:center; z-index:2;
    background:rgba(20,16,30,.88); border:1px solid rgba(255,233,173,.25);
    border-radius:26px; padding:7px 12px; }
  #zoomBar button { background:none; border:none; color:#ffe9ad; font-size:20px; cursor:pointer; padding:2px 10px; }
  #zoomInfo { color:#e8dcc0; font-family:var(--tel); font-size:13px; min-width:64px; text-align:center; }
  #zoomHint { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:2;
    color:rgba(255,233,173,.75); font-family:var(--tel); font-size:12.5px;
    background:rgba(20,16,30,.7); padding:6px 16px; border-radius:20px; pointer-events:none;
    transition: opacity 1s ease; }
  #zoomHint.faded { opacity:0; }

  /* snappier, lighter flip on phones */
  @media (max-width: 640px) {
    .sheet { transition-duration: 640ms; }
    .face { box-shadow:none; }
  }

  /* toast */
  #toast { position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-80px); z-index:90;
    background:rgba(20,16,30,.9); color:#ffe9ad; font-family:var(--tel); font-size:15px;
    padding:11px 22px; border-radius:30px; border:1px solid rgba(255,233,173,.25);
    transition: transform .5s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #toast.show { transform:translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    #milestone { width:96px; top:14px; left:14px; }
    #milestone .place { font-size:11px; } #milestone .km { font-size:17px; }
    #bar { gap:6px; } #bar button, #bar a.btn { padding:6px 8px; font-size:11px; }
    #pageInfo { min-width:56px; font-size:12px; }
  }
  @media (max-width: 460px) {
    #bar { gap:4px; } #bar button, #bar a.btn { padding:5px 6px; font-size:10.5px; }
    #btnFull { display:none; }
    #btnPrev, #btnNext { display:none; } /* swipe + edge taps cover navigation */
    #pageInfo { min-width:48px; }
  }
</style>
</head>
<body>

<div id="world">
  <div class="sky dusk"></div>
  <div class="sky night"></div>
  <div id="stars"></div>
  <svg id="moon" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="#fff3c9"/>
    <circle cx="34" cy="36" r="7" fill="#e8d9a8" opacity=".7"/>
    <circle cx="63" cy="63" r="9" fill="#e8d9a8" opacity=".55"/>
    <circle cx="66" cy="30" r="4.5" fill="#e8d9a8" opacity=".6"/>
    <path d="M44 66 q-2 -8 3 -12 q4 -3 8 -1 q1 -6 5 -9 q2 -2 3 0 q1 2 -1 5 q-2 3 -2 5 q4 -1 6 2 q3 4 0 8 q-3 4 -10 4 q-8 0 -12 -2 z" fill="#c9b581" opacity=".85"/>
  </svg>
  <div id="hills"  class="scroller"></div>
  <div id="trees"  class="scroller"></div>
  <div id="poles"  class="scroller"></div>
  <div id="ground"></div>
  <div id="road"></div>
  <div id="glare"></div>
  <div id="frame"></div>
</div>

<div id="milestone">
  <div class="cap"></div>
  <div class="stone">
    <div class="place">అమ్మమ్మ ఊరు</div>
    <div class="km"><span id="kmVal">–</span> <small>కి.మీ</small></div>
  </div>
</div>

<div id="stage">
  <div id="bookBob"><div id="bookShift">
    <div id="book">
      <div class="zone" id="zonePrev" title="వెనుక పేజీ"><div class="hint">‹</div></div>
      <div class="zone" id="zoneNext" title="తరువాత పేజీ"><div class="hint">›</div></div>
    </div>
  </div></div>
</div>

<div id="bar">
  <div id="progressTrack"><div id="progressFill"></div></div>
  <a class="btn" id="btnStall" href="./" title="బుక్ స్టాల్‌కు తిరిగి">🏪 స్టాల్</a>
  <button id="btnPrev" title="←">‹ వెనుకకు</button>
  <div id="pageInfo">…</div>
  <button id="btnNext" title="→">ముందుకు ›</button>
  <button id="btnZoom" title="పెద్దది చేయండి">🔍</button>
  <button id="btnThumbs" title="అన్ని పేజీలు">☰ పేజీలు</button>
  <button id="btnSound" title="శబ్దం">🔊 ప్రయాణం</button>
  <button id="btnFull" title="పూర్తి తెర">⛶</button>
</div>

<div id="thumbs">
  <header>
    <span id="thumbsTitle">అన్ని పేజీలు</span>
    <button id="btnCloseThumbs">✕</button>
  </header>
  <div id="thumbGrid"></div>
</div>

<div id="zoomer">
  <img id="zoomImg" alt="" draggable="false">
  <div id="zoomHint">పించ్ చేసి పెద్దది చేయండి · రెండుసార్లు నొక్కండి</div>
  <div id="zoomBar">
    <button id="zoomPrevBtn" title="వెనుక పేజీ">‹</button>
    <span id="zoomInfo"></span>
    <button id="zoomNextBtn" title="తరువాత పేజీ">›</button>
    <button id="zoomCloseBtn" title="మూసివేయి">✕</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var AR = 1191 / 1872;           // page aspect ratio (w/h)

  var TOTAL = 0, SHEETS = 0, edition = null, base = '';
  var book = document.getElementById('book');
  var bookShift = document.getElementById('bookShift');
  var stage = document.getElementById('stage');
  var sheets = [];
  var cs = 0;                     // sheets turned (0..SHEETS)
  var narrow = false;             // single-page mode
  var side = 'right';             // which half is focused in narrow mode
  var soundOn = true;

  /* ---------- edition bootstrap ---------- */
  var params = new URLSearchParams(location.search);
  var edId = params.get('e');
  if (!edId){ location.replace('./'); return; }

  fetch('data/editions.json')
    .then(function(r){ if (!r.ok) throw new Error('manifest'); return r.json(); })
    .then(function(data){
      edition = (data.editions || []).find(function(e){ return e.id === edId; });
      if (!edition){ location.replace('./'); return; }
      var b = data.baseUrl || '';
      if (b && b.slice(-1) !== '/') b += '/';
      base = b + 'editions/' + edition.id;
      TOTAL = edition.pages;
      SHEETS = Math.ceil(TOTAL / 2);
      document.title = edition.title + ' · చందమామ';
      init();
    })
    .catch(function(){
      toast('సంచిక దొరకలేదు…');
      setTimeout(function(){ location.replace('./'); }, 1800);
    });

  function pageFile(n){
    var s = n < 10 ? '00'+n : (n < 100 ? '0'+n : ''+n);
    return base + '/pages/page-' + s + '.webp';
  }

  /* ---------- build sheets ---------- */
  function buildSheets(){
    for (var i=0; i<SHEETS; i++){
      var s = document.createElement('div');
      s.className = 'sheet';
      s.innerHTML =
        '<div class="face front"><div class="loading">చందమామ…</div><div class="shade"></div></div>' +
        '<div class="face back"><div class="loading">చందమామ…</div><div class="shade"></div></div>';
      s.dataset.front = 2*i+1;
      s.dataset.back  = 2*i+2;
      book.insertBefore(s, book.firstChild);
      sheets.push(s);
    }
  }

  function loadFace(sheet, cls, n){
    var face = sheet.querySelector('.face.'+cls);
    if (face.dataset.done) return;
    face.dataset.done = '1';
    var ld = face.querySelector('.loading');
    if (n > TOTAL){ if (ld) ld.remove(); return; }   /* odd page count: blank paper */
    var img = document.createElement('img');
    img.src = pageFile(n);
    img.alt = 'పేజీ ' + n;
    img.draggable = false;
    img.decoding = 'async';
    face.insertBefore(img, face.querySelector('.shade'));
  }
  function ensureWindowLoaded(){
    var from = Math.max(0, cs-3), to = Math.min(SHEETS-1, cs+5);
    for (var i=from; i<=to; i++){
      loadFace(sheets[i],'front', +sheets[i].dataset.front);
      loadFace(sheets[i],'back',  +sheets[i].dataset.back);
    }
  }
  var preloadIdx = 0;
  function trickle(){
    if (preloadIdx >= SHEETS) return;
    loadFace(sheets[preloadIdx],'front', +sheets[preloadIdx].dataset.front);
    loadFace(sheets[preloadIdx],'back',  +sheets[preloadIdx].dataset.back);
    preloadIdx++;
    setTimeout(trickle, 350);
  }

  /* ---------- layout ---------- */
  function layout(){
    var barH = 56;
    var availH = window.innerHeight - barH - 40;
    var availW = window.innerWidth - 40;
    narrow = (availW < availH * AR * 1.7);
    var ph, pw;
    if (!narrow){
      ph = Math.min(availH * 0.92, (availW * 0.84 / 2) / AR);
      pw = ph * AR;
    } else {
      ph = Math.min(availH * 0.88, (availW * 0.92) / AR);
      pw = ph * AR;
    }
    document.documentElement.style.setProperty('--pw', pw+'px');
    document.documentElement.style.setProperty('--ph', ph+'px');
    if (narrow){
      bookShift.style.width = pw+'px';
      applyShift(false);
    } else {
      bookShift.style.width = '';
      bookShift.style.transform = '';
    }
  }
  function applyShift(animate){
    if (!narrow) return;
    var pw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
    bookShift.style.transition = animate ? '' : 'none';
    bookShift.style.transform = (side === 'right') ? 'translateX('+(-pw)+'px)' : 'translateX(0)';
    if (!animate){ void bookShift.offsetWidth; bookShift.style.transition=''; }
  }

  /* ---------- z-index + classes ---------- */
  function paint(instant){
    for (var i=0;i<SHEETS;i++){
      var s = sheets[i];
      if (instant) s.classList.add('no-anim');
      if (i < cs){ s.classList.add('turned'); s.style.zIndex = 10 + i; }
      else { s.classList.remove('turned'); s.style.zIndex = 10 + (SHEETS - i); }
    }
    if (instant){
      void book.offsetWidth;
      for (var j=0;j<SHEETS;j++) sheets[j].classList.remove('no-anim');
    }
    updateHud();
    ensureWindowLoaded();
    save();
  }
  function raiseDuringTurn(i){
    sheets[i].style.zIndex = 400;
    sheets[i].style.willChange = 'transform';
    (function(sh){
      var done = function(){
        sh.removeEventListener('transitionend', done);
        sh.style.willChange = '';
        paint(false);
      };
      sh.addEventListener('transitionend', done);
      setTimeout(done, 1000);
    })(sheets[i]);
  }

  /* ---------- navigation ---------- */
  function visiblePage(){
    if (narrow) return side==='right' ? Math.min(TOTAL, 2*cs+1) : Math.max(1, 2*cs);
    return Math.max(1, Math.min(TOTAL, cs===0 ? 1 : 2*cs));
  }
  function next(){
    if (narrow){
      if (side === 'right'){
        if (cs >= SHEETS) return;
        cs++; raiseDuringTurn(cs-1); sheets[cs-1].classList.add('turned');
        side = 'left'; applyShift(true); sfxFlip();
      } else {
        if (2*cs+1 > TOTAL) return;
        side = 'right'; applyShift(true);
      }
      updateHud(); ensureWindowLoaded(); save();
    } else {
      if (cs >= SHEETS) return;
      cs++; raiseDuringTurn(cs-1); sheets[cs-1].classList.add('turned');
      sfxFlip(); updateHud(); ensureWindowLoaded(); save();
    }
  }
  function prev(){
    if (narrow){
      if (side === 'left'){
        cs--; raiseDuringTurn(cs); sheets[cs].classList.remove('turned');
        side = 'right'; applyShift(true); sfxFlip();
      } else {
        if (cs === 0) return;
        side = 'left'; applyShift(true);
      }
      updateHud(); ensureWindowLoaded(); save();
    } else {
      if (cs === 0) return;
      cs--; raiseDuringTurn(cs); sheets[cs].classList.remove('turned');
      sfxFlip(); updateHud(); ensureWindowLoaded(); save();
    }
  }
  function goToPage(p){
    p = Math.max(1, Math.min(TOTAL, p));
    cs = Math.floor(p/2);
    if (narrow) side = (p % 2 === 1) ? 'right' : 'left';
    paint(true);
    applyShift(false);
  }

  /* ---------- HUD ---------- */
  var kmVal = document.getElementById('kmVal');
  var milestone = document.getElementById('milestone');
  var pageInfo = document.getElementById('pageInfo');
  var progressFill = document.getElementById('progressFill');
  function updateHud(){
    var p = visiblePage();
    var km = TOTAL - p;
    var prog = TOTAL > 1 ? (p-1)/(TOTAL-1) : 1;
    document.documentElement.style.setProperty('--prog', prog.toFixed(3));
    if (km <= 0){
      milestone.classList.add('home');
      milestone.querySelector('.place').textContent = 'వచ్చేశాం! 🏡';
      kmVal.parentNode.style.display='none';
    } else {
      milestone.classList.remove('home');
      milestone.querySelector('.place').textContent = 'అమ్మమ్మ ఊరు';
      kmVal.parentNode.style.display='';
      kmVal.textContent = km;
    }
    milestone.classList.add('bump');
    setTimeout(function(){ milestone.classList.remove('bump'); }, 320);
    if (!narrow && cs>0 && cs<SHEETS) pageInfo.textContent = (2*cs) + '–' + Math.min(TOTAL, 2*cs+1) + ' / ' + TOTAL;
    else pageInfo.textContent = p + ' / ' + TOTAL;
    progressFill.style.width = (prog*100)+'%';
  }
  function save(){
    try {
      var p = visiblePage();
      localStorage.setItem('cm-' + edition.id, String(p));
      var recent = [];
      try { recent = JSON.parse(localStorage.getItem('cm-recent') || '[]'); } catch(e){}
      recent = recent.filter(function(r){ return r.id !== edition.id; });
      recent.unshift({ id: edition.id, page: p, when: Date.now() });
      localStorage.setItem('cm-recent', JSON.stringify(recent.slice(0, 12)));
    } catch(e){}
  }

  /* ---------- scenery SVG tiles ---------- */
  function svgUrl(s){ return 'url("data:image/svg+xml,'+encodeURIComponent(s)+'")'; }
  var hillsSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">'+
    '<path d="M0 240 L0 150 Q120 90 260 140 Q380 180 520 120 Q660 60 800 130 Q930 190 1060 140 Q1140 110 1200 150 L1200 240 Z" fill="%23151238"/></svg>';
  function palm(x, sc){
    return '<g transform="translate('+x+',330) scale('+sc+')">'+
      '<path d="M-6 0 L-3 -150 L3 -150 L6 0 Z"/>'+
      '<g transform="translate(0,-150)">'+
      '<path d="M0 0 Q-45 -18 -70 -2 Q-40 -26 0 -14 Z"/>'+
      '<path d="M0 0 Q45 -18 70 -2 Q40 -26 0 -14 Z"/>'+
      '<path d="M0 -6 Q-38 -42 -58 -40 Q-28 -52 0 -20 Z"/>'+
      '<path d="M0 -6 Q38 -42 58 -40 Q28 -52 0 -20 Z"/>'+
      '<path d="M-3 -10 Q-8 -55 -20 -62 Q0 -58 4 -18 Z"/>'+
      '<path d="M3 -10 Q8 -55 20 -62 Q0 -58 -4 -18 Z"/>'+
      '</g></g>';
  }
  function shrub(x){
    return '<path transform="translate('+x+',330)" d="M-25 0 Q-22 -22 0 -24 Q22 -22 25 0 Z"/>';
  }
  var treesSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">'+
    ['<g fill="%230d0a18">',
     palm(90,1.0), palm(310,0.75), palm(560,1.1), palm(820,0.85), palm(1050,0.95),
     '<rect x="0" y="325" width="1200" height="15"/>',
     shrub(200), shrub(430), shrub(700), shrub(950), shrub(1150),
     '</g>'].join('')+'</svg>';
  var polesSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">'+
    '<g stroke="%23070510" fill="%23070510">'+
    '<rect x="70" y="90" width="9" height="430"/>'+
    '<rect x="46" y="100" width="58" height="6"/>'+
    '<rect x="52" y="126" width="46" height="5"/>'+
    '<circle cx="52" cy="98" r="4"/><circle cx="98" cy="98" r="4"/>'+
    '<path d="M75 103 Q225 150 375 103" fill="none" stroke-width="2.5" opacity=".8"/>'+
    '<path d="M75 129 Q225 172 375 129" fill="none" stroke-width="2.5" opacity=".8"/>'+
    '<path d="M375 103 Q525 150 675 103" fill="none" stroke-width="2.5" opacity=".8"/>'+
    '<path d="M375 129 Q525 172 675 129" fill="none" stroke-width="2.5" opacity=".8"/>'+
    '<rect x="370" y="90" width="9" height="430"/>'+
    '<rect x="346" y="100" width="58" height="6"/>'+
    '<rect x="352" y="126" width="46" height="5"/>'+
    '<circle cx="352" cy="98" r="4"/><circle cx="398" cy="98" r="4"/>'+
    '</g></svg>';
  document.getElementById('hills').style.backgroundImage = svgUrl(hillsSvg);
  document.getElementById('trees').style.backgroundImage = svgUrl(treesSvg);
  document.getElementById('poles').style.backgroundImage = svgUrl(polesSvg);

  var starsBox = document.getElementById('stars');
  for (var st=0; st<70; st++){
    var d = document.createElement('div');
    d.className = 'star';
    var sz = Math.random()*2+0.6;
    d.style.width = d.style.height = sz+'px';
    d.style.left = (Math.random()*100)+'%';
    d.style.top = (Math.random()*55)+'%';
    d.style.animationDelay = (Math.random()*3)+'s';
    d.style.animationDuration = (2+Math.random()*3)+'s';
    starsBox.appendChild(d);
  }

  /* ---------- audio (all synthesized) ---------- */
  var AC = null, masterGain = null, rumbleGain = null;
  function initAudio(){
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);
      var len = AC.sampleRate * 2.5;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0), last = 0;
      for (var i=0;i<len;i++){
        var w = Math.random()*2-1;
        last = (last + 0.02*w)/1.02;
        data[i] = last * 3.2;
      }
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 95; lp.Q.value = 0.6;
      rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
      src.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(masterGain);
      src.start();
      var osc = AC.createOscillator(); osc.type='sine'; osc.frequency.value = 46;
      var og = AC.createGain(); og.gain.value = 0.035;
      var lfo = AC.createOscillator(); lfo.frequency.value = 0.35;
      var lg = AC.createGain(); lg.gain.value = 3.5;
      lfo.connect(lg); lg.connect(osc.frequency);
      osc.connect(og); og.connect(rumbleGain);
      osc.start(); lfo.start();
    } catch(e){ AC = null; }
  }
  function rumbleTo(v){
    if (!AC || !rumbleGain) return;
    rumbleGain.gain.cancelScheduledValues(AC.currentTime);
    rumbleGain.gain.linearRampToValueAtTime(v, AC.currentTime + 1.5);
  }
  function sfxHorn(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime;
    [438, 552].forEach(function(f){
      var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      var bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = f*1.6; bp.Q.value = 1.6;
      var g = AC.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.055, t+0.05);
      g.gain.setValueAtTime(0.055, t+0.42);
      g.gain.linearRampToValueAtTime(0, t+0.6);
      g.gain.linearRampToValueAtTime(0.05, t+0.72);
      g.gain.setValueAtTime(0.05, t+1.1);
      g.gain.linearRampToValueAtTime(0, t+1.35);
      o.connect(bp); bp.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t+1.4);
    });
  }
  function sfxFlip(){
    if (!AC || !soundOn) return;
    var t = AC.currentTime;
    var len = AC.sampleRate * 0.4;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.5);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(700, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t+0.18);
    bp.frequency.exponentialRampToValueAtTime(900, t+0.38);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    src.start(t);
  }
  /* audio needs a user gesture: arm once */
  var audioArmed = false;
  function armAudio(){
    if (audioArmed) return;
    audioArmed = true;
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    if (soundOn){ sfxHorn(); rumbleTo(0.12); }
  }
  document.addEventListener('pointerdown', armAudio, {once:false, passive:true});
  document.addEventListener('keydown', armAudio, {passive:true});

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3200);
  }

  /* ---------- thumbnails ---------- */
  var thumbs = document.getElementById('thumbs');
  var grid = document.getElementById('thumbGrid');
  var thumbsBuilt = false;
  function buildThumbs(){
    if (thumbsBuilt) return;
    thumbsBuilt = true;
    for (var p=1;p<=TOTAL;p++){
      var th = document.createElement('div');
      th.className = 'th'; th.dataset.p = p;
      th.innerHTML = '<img loading="lazy" src="'+pageFile(p)+'" alt=""><span>'+p+'</span>';
      th.addEventListener('click', function(){
        goToPage(+this.dataset.p);
        thumbs.classList.remove('open');
      });
      grid.appendChild(th);
    }
  }
  document.getElementById('btnThumbs').addEventListener('click', function(){
    buildThumbs();
    var cur = visiblePage();
    var all = grid.querySelectorAll('.th');
    for (var i=0;i<all.length;i++) all[i].classList.toggle('current', +all[i].dataset.p===cur);
    thumbs.classList.add('open');
    var el = grid.querySelector('.th.current');
    if (el) el.scrollIntoView({block:'center'});
  });
  document.getElementById('btnCloseThumbs').addEventListener('click', function(){ thumbs.classList.remove('open'); });

  /* ---------- zoom (pinch / double-tap / wheel) ---------- */
  var zoomer = document.getElementById('zoomer');
  var zoomImg = document.getElementById('zoomImg');
  var zoomInfo = document.getElementById('zoomInfo');
  var zoomHint = document.getElementById('zoomHint');
  var zoomPage = 1, zs = 1, ztx = 0, zty = 0, fitW = 0, fitH = 0;
  var zoomOpen = false;

  function zoomRender(){
    zoomImg.style.width = fitW + 'px';
    zoomImg.style.transform = 'translate('+ztx+'px,'+zty+'px) scale('+zs+')';
  }
  function zoomFit(){
    var W = window.innerWidth, H = window.innerHeight;
    fitW = Math.min(W, H * AR); fitH = fitW / AR;
    zs = 1; ztx = (W - fitW)/2; zty = (H - fitH)/2;
    zoomRender();
  }
  function zoomClamp(){
    var W = window.innerWidth, H = window.innerHeight;
    var w = fitW * zs, h = fitH * zs;
    if (w <= W) ztx = (W - w)/2; else ztx = Math.max(W - w, Math.min(0, ztx));
    if (h <= H) zty = (H - h)/2; else zty = Math.max(H - h, Math.min(0, zty));
  }
  function openZoom(p){
    zoomPage = Math.max(1, Math.min(TOTAL, p));
    zoomImg.src = pageFile(zoomPage);
    zoomInfo.textContent = zoomPage + ' / ' + TOTAL;
    zoomer.classList.add('open');
    zoomOpen = true;
    zoomHint.classList.remove('faded');
    setTimeout(function(){ zoomHint.classList.add('faded'); }, 2600);
    zoomFit();
  }
  function closeZoom(){
    zoomer.classList.remove('open');
    zoomOpen = false;
    if (edition && zoomPage !== visiblePage()) goToPage(zoomPage);
  }
  function zoomStep(d){
    var p = Math.max(1, Math.min(TOTAL, zoomPage + d));
    if (p === zoomPage) return;
    zoomPage = p;
    zoomImg.src = pageFile(p);
    zoomInfo.textContent = p + ' / ' + TOTAL;
    zoomFit();
  }
  document.getElementById('btnZoom').addEventListener('click', function(){ if (edition) openZoom(visiblePage()); });
  document.getElementById('zoomCloseBtn').addEventListener('click', closeZoom);
  document.getElementById('zoomPrevBtn').addEventListener('click', function(){ zoomStep(-1); });
  document.getElementById('zoomNextBtn').addEventListener('click', function(){ zoomStep(1); });
  window.addEventListener('resize', function(){ if (zoomOpen) zoomFit(); });

  var zPointers = new Map();
  var pinch0 = null;
  zoomer.addEventListener('pointerdown', function(e){
    if (e.target.closest && e.target.closest('#zoomBar')) return;
    if (zoomer.setPointerCapture){ try { zoomer.setPointerCapture(e.pointerId); } catch(err){} }
    zPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (zPointers.size === 2){
      var pts = Array.from(zPointers.values());
      pinch0 = {
        d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1,
        mx:(pts[0].x+pts[1].x)/2, my:(pts[0].y+pts[1].y)/2,
        s: zs, tx: ztx, ty: zty
      };
    }
  });
  zoomer.addEventListener('pointermove', function(e){
    var p = zPointers.get(e.pointerId);
    if (!p) return;
    var px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (zPointers.size === 2 && pinch0){
      var pts = Array.from(zPointers.values());
      var d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      var mx = (pts[0].x+pts[1].x)/2, my = (pts[0].y+pts[1].y)/2;
      var ns = Math.max(1, Math.min(6, pinch0.s * (d / pinch0.d)));
      ztx = mx - (pinch0.mx - pinch0.tx) * (ns / pinch0.s);
      zty = my - (pinch0.my - pinch0.ty) * (ns / pinch0.s);
      zs = ns;
      zoomClamp(); zoomRender();
    } else if (zPointers.size === 1){
      ztx += e.clientX - px; zty += e.clientY - py;
      zoomClamp(); zoomRender();
    }
  });
  function zEnd(e){
    zPointers.delete(e.pointerId);
    if (zPointers.size < 2) pinch0 = null;
  }
  zoomer.addEventListener('pointerup', zEnd);
  zoomer.addEventListener('pointercancel', zEnd);

  function zoomToggleAt(x, y){
    zoomImg.style.transition = 'transform .28s ease';
    setTimeout(function(){ zoomImg.style.transition = ''; }, 300);
    if (zs > 1.05){ zoomFit(); return; }
    var ns = 2.6;
    ztx = x - (x - ztx) * (ns / zs);
    zty = y - (y - zty) * (ns / zs);
    zs = ns; zoomClamp(); zoomRender();
  }
  var zLastTap = 0, zLastX = 0, zLastY = 0;
  zoomer.addEventListener('pointerup', function(e){
    if (e.target.closest && e.target.closest('#zoomBar')) return;
    var now = Date.now();
    if (now - zLastTap < 320 && Math.hypot(e.clientX-zLastX, e.clientY-zLastY) < 30){
      zoomToggleAt(e.clientX, e.clientY);
      zLastTap = 0;
    } else { zLastTap = now; zLastX = e.clientX; zLastY = e.clientY; }
  });
  zoomer.addEventListener('wheel', function(e){
    e.preventDefault();
    var ns = Math.max(1, Math.min(6, zs * (e.deltaY < 0 ? 1.15 : 0.87)));
    ztx = e.clientX - (e.clientX - ztx) * (ns / zs);
    zty = e.clientY - (e.clientY - zty) * (ns / zs);
    zs = ns; zoomClamp(); zoomRender();
  }, {passive:false});

  /* block native page zoom — the in-reader zoom replaces it */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  /* ---------- controls ---------- */
  document.getElementById('zoneNext').addEventListener('click', next);
  document.getElementById('zonePrev').addEventListener('click', prev);
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.addEventListener('keydown', function(e){
    if (!edition) return;
    if (zoomOpen){
      if (e.key==='Escape') closeZoom();
      else if (e.key==='ArrowRight'){ e.preventDefault(); zoomStep(1); }
      else if (e.key==='ArrowLeft'){ e.preventDefault(); zoomStep(-1); }
      return;
    }
    if (thumbs.classList.contains('open')){
      if (e.key==='Escape') thumbs.classList.remove('open');
      return;
    }
    if (e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if (e.key==='Home'){ goToPage(1); }
    else if (e.key==='End'){ goToPage(TOTAL); }
  });
  /* swipe + page gestures: multi-touch aware */
  var swipeX = null, activePts = new Map();
  var tapT = 0, tapX = 0, tapY = 0;
  function swipeEnd(x){
    if (swipeX === null || !edition || zoomOpen) return;
    var dx = x - swipeX; swipeX = null;
    if (Math.abs(dx) > 45){ if (dx < 0) next(); else prev(); }
  }
  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){
      if (zoomOpen) return;
      activePts.set(e.pointerId, true);
      if (activePts.size === 2 && edition && e.target.closest && e.target.closest('#stage')){
        swipeX = null;
        openZoom(visiblePage());    /* two-finger touch on the page = zoom */
        return;
      }
      if (activePts.size > 1){ swipeX = null; return; }
      swipeX = e.clientX;
    }, {passive:true});
    document.addEventListener('pointerup', function(e){
      activePts.delete(e.pointerId);
      if (zoomOpen) return;
      swipeEnd(e.clientX);
      /* double-tap on the open page = zoom */
      if (edition && e.target.closest && e.target.closest('#stage') && !e.target.closest('.zone')){
        var now = Date.now();
        if (now - tapT < 320 && Math.hypot(e.clientX-tapX, e.clientY-tapY) < 30){
          openZoom(visiblePage()); tapT = 0;
        } else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
      }
    }, {passive:true});
    document.addEventListener('pointercancel', function(e){ activePts.delete(e.pointerId); swipeX = null; }, {passive:true});
  } else {
    document.addEventListener('touchstart', function(e){ if (!zoomOpen) swipeX = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend',   function(e){ swipeEnd(e.changedTouches[0].clientX); }, {passive:true});
  }

  var btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', function(){
    soundOn = !soundOn;
    btnSound.textContent = (soundOn ? '🔊' : '🔇') + ' ప్రయాణం';
    document.body.classList.toggle('paused', !soundOn);
    if (soundOn){ initAudio(); if (AC && AC.state==='suspended') AC.resume(); rumbleTo(0.12); }
    else rumbleTo(0);
  });
  document.getElementById('btnFull').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });

  /* ---------- boot ---------- */
  function init(){
    document.getElementById('thumbsTitle').textContent = 'అన్ని పేజీలు · ' + edition.title;
    buildSheets();
    layout();
    var saved = 1;
    try { saved = parseInt(localStorage.getItem('cm-' + edition.id) || '1', 10) || 1; } catch(e){}
    if (saved > 1 && saved <= TOTAL){
      goToPage(saved);
      toast('మీరు ఆగిన చోటు నుండి… పేజీ ' + saved);
    } else {
      paint(true);
    }
    setTimeout(trickle, 4000);
    window.addEventListener('resize', function(){ layout(); paint(true); });
  }
})();
</script>
</body>
